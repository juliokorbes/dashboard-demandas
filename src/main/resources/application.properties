spring.application.name=dashboard-demandas

spring.datasource.url=jdbc:sqlite:${dashboard.database.path}
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configurações temporárias da dashboard
dashboard.due-soon-days=5
dashboard.completed-statuses=CONCLUIDA
spring.application.name=dashboard-demandas

spring.datasource.url=jdbc:sqlite:${dashboard.database.path:data/dashboard.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Configurações da dashboard

dashboard.due-soon-days=5
dashboard.completed-statuses=CONCLUIDA